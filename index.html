<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <button id="backBtn" title="Back">◀</button>
    <button id="forwardBtn" title="Forward">▶</button>
    <button id="reloadBtn" title="Reload">⟳</button>
    <button id="homeBtn" title="Home">🏠</button>
    <input id="urlBar" type="text" placeholder="Search or enter URL..." spellcheck="false">
    <button id="bookmarkBtn" title="Bookmark">⭐</button>
    <button id="incognitoBtn" title="New Incognito Window">👤</button>
    <button id="downloadsBtn" title="Downloads">⬇</button>
    <button id="settingsBtn" title="Settings">⚙</button>
    <button id="newTabBtn" title="New Tab">+</button>
  </div>

  <!-- Tabs -->
  <div id="tabsContainer"></div>

  <!-- Webviews -->
  <div id="webviewContainer"></div>

  <!-- Panels (hidden by default) -->
  <div id="bookmarksPanel" class="panel hidden">
    <h3>Bookmarks</h3>
    <input id="bookmarkSearch" placeholder="Search bookmarks..." />
    <ul id="bookmarkList"></ul>
  </div>
  <div id="historyPanel" class="panel hidden">
    <h3>History</h3>
    <input id="historySearch" placeholder="Search history..." />
    <button id="clearHistoryBtn">Clear All</button>
    <ul id="historyList"></ul>
  </div>
  <div id="downloadsPanel" class="panel hidden">
    <h3>Downloads</h3>
    <ul id="downloadsList"></ul>
    <button id="clearDownloadsBtn">Clear Completed</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
