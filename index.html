<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Awesome Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar">
    <button id="backBtn">⬅️</button>
    <button id="forwardBtn">➡️</button>
    <button id="reloadBtn">🔄</button>
    <input id="urlBar" type="text" placeholder="Search or type web address">
    <button id="newTabBtn">➕</button>
  </div>
  <div id="tabsContainer"></div>
  <div id="webviewContainer"></div>
  <script src="renderer.js"></script>
</body>
</html>
