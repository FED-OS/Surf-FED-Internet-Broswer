name: Build EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run dist -- --win --publish never
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Browser-EXE
          path: dist/*.exe
