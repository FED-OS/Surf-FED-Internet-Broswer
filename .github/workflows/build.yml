name: Build Browser Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist -- --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Installer
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build macOS installer
        run: npm run dist -- --mac

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Installer-Mac
          path: dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Linux installer
        run: npm run dist -- --linux

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Installer-Linux
          path: dist/*.AppImage
